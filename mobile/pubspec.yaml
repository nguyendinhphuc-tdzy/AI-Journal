name: ai_diary
description: AI Diary Android emulator demo.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito/Nunito-400.ttf
          weight: 400
        - asset: assets/fonts/Nunito/Nunito-500.ttf
          weight: 500
        - asset: assets/fonts/Nunito/Nunito-600.ttf
          weight: 600
        - asset: assets/fonts/Nunito/Nunito-700.ttf
          weight: 700
        - asset: assets/fonts/Nunito/Nunito-800.ttf
          weight: 800
    - family: Be Vietnam Pro
      fonts:
        - asset: assets/fonts/BeVietnamPro/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro/BeVietnamPro-Bold.ttf
          weight: 700
        - asset: assets/fonts/BeVietnamPro/BeVietnamPro-Italic.ttf
          weight: 400
          style: italic

  assets:
    - assets/images/background_homescreen.png
    - assets/images/background_journal.png
    - assets/images/docsach.gif
    - assets/images/laixe.gif
    - assets/images/like.gif
    - assets/images/loading.gif
    - assets/icons/
    - assets/mascot/
